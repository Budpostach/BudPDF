<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankPDF Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="h-full bg-slate-100 text-slate-800 font-sans antialiased flex flex-col justify-between">
    <div id="root" class="flex-grow flex flex-col"></div>
    <script>
        const MAX_BYTES = 490 * 1024;
        let filesQueue = [];
        let isProcessing = false;

        function renderApp() {
            document.getElementById('root').innerHTML = `
                <header class="bg-slate-900 text-white shadow-md p-4">
                    <h1 class="text-xl font-bold">BankPDF Converter</h1>
                    <p class="text-xs text-slate-300">Підготовка PDF-документів для банків України</p>
                </header>
                <main class="max-w-4xl mx-auto p-6 w-full space-y-6">
                    <div class="bg-white rounded-2xl border-2 border-dashed border-slate-300 p-8 text-center cursor-pointer"
                         onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
                        <p class="font-semibold text-slate-700">Натисніть для вибору PDF-файлу</p>
                    </div>
                    <button onclick="startConversion()" class="w-full bg-[#f35c09] text-white font-semibold py-3 rounded-xl">
                        Конвертувати у Ч/Б (&le;490 КБ)
                    </button>
                </main>
            `;
        }
        function handleFileSelect(e) { filesQueue = Array.from(e.target.files).map(file => ({ file })); alert('Файл завантажено в чергу!'); }
        function startConversion() { alert('Готово до конвертації'); }
        renderApp();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BankPDF Converter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .drop { border: 2px dashed #cbd5e1; }
  .drop.drag { border-color: #2563eb; background: #eff6ff; }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
<header class="bg-slate-950 text-white">
  <div class="max-w-6xl mx-auto px-5 py-5 flex gap-4 justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">BankPDF <span class="text-blue-400">Converter</span></h1>
      <p class="text-slate-300 text-sm" data-i18n="subtitle">Постраничное разделение · Grayscale · &lt; 490 KB</p>
    </div>
    <div>
      <button id="ru" class="px-3 py-1 rounded bg-blue-700">RU</button>
      <button id="ua" class="px-3 py-1 rounded">UA</button>
      <button id="en" class="px-3 py-1 rounded">EN</button>
    </div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-5 py-8 grid lg:grid-cols-3 gap-6">
<section class="lg:col-span-1 space-y-5">
  <label id="drop" class="drop bg-white rounded-2xl shadow-sm p-8 cursor-pointer block text-center">
    <input id="input" type="file" accept=".pdf,application/pdf" multiple class="hidden">
    <div class="text-4xl mb-3">⇧</div>
    <div class="font-semibold" data-i18n="upload">Выбери PDF или перетащи сюда</div>
    <p class="text-sm text-slate-500 mt-2" data-i18n="local">Обработка локально в браузере. Файлы не отправляются на сервер.</p>
  </label>
  <div class="bg-white rounded-2xl shadow-sm p-6">
    <h2 class="font-bold mb-4" data-i18n="settings">Параметры обработки</h2>
    <dl class="space-y-3 text-sm">
      <div class="flex justify-between gap-3"><dt data-i18n="resolution">Разрешение</dt><dd class="font-bold">Автоподбор (до &lt;490 КБ)</dd></div>
      <div class="flex justify-between gap-3"><dt data-i18n="color">Цвет</dt><dd class="font-bold">Grayscale (Черно-белый)</dd></div>
      <div class="flex justify-between gap-3"><dt data-i18n="size">Макс. размер файла</dt><dd class="font-bold text-blue-700">490 КБ / страница</dd></div>
      <div class="flex justify-between gap-3"><dt data-i18n="output">Режим</dt><dd class="font-bold">Каждая страница — отдельный PDF</dd></div>
    </dl>
  </div>
  <button id="convert" disabled class="w-full rounded-xl py-3 bg-blue-700 text-white font-semibold hover:bg-blue-800" data-i18n="convert">Разделить и конвертировать</button>
  <button id="clear" class="w-full rounded-xl py-2 border border-slate-300 bg-white text-sm" data-i18n="clear">Очистить очередь</button>
</section>
<section class="lg:col-span-2 bg-white rounded-2xl shadow-sm p-6">
  <div class="flex justify-between flex-wrap gap-3 items-center mb-5">
    <h2 class="font-bold text-lg" data-i18n="queue">Документы и страницы</h2>
    <button id="all" class="hidden rounded-lg bg-slate-900 text-white text-sm px-4 py-2" data-i18n="downloadall">Скачать всё (ZIP)</button>
  </div>
  <div id="queueItems" class="space-y-3"><p class="text-slate-400" data-i18n="empty">Очередь пуста</p></div>
</section>
</main>
<footer class="text-center text-slate-500 text-xs py-5">BankPDF Converter · Budpostach</footer>
<script>
'use strict';
const PDFJS_ASSETS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/";
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = id => document.getElementById(id);
const i18n = {
  ru: { subtitle: 'Постраничное разделение · Grayscale · &lt; 490 KB', upload: 'Выбери PDF или перетащи сюда', local: 'Обработка локально в браузере.', settings: 'Параметры обработки', resolution: 'Разрешение', color: 'Цвет', size: 'Макс. размер', output: 'Режим', convert: 'Разделить и конвертировать', clear: 'Очистить очередь', queue: 'Результаты по страницам', downloadall: 'Скачать всё (ZIP)', empty: 'Очередь пуста', wait: 'В очереди', working: 'Обработка...', done: 'Готово', download: 'Скачать PDF', error: 'Ошибка', cancel: 'Удалить', pages: 'Страниц', out: 'Размер' },
  ua: { subtitle: 'Посторінковий поділ · Grayscale · &lt; 490 KB', upload: 'Оберіть PDF або перетягніть сюди', local: 'Обробка локально у браузері.', settings: 'Параметри обробки', resolution: 'Роздільна здатність', color: 'Колір', size: 'Макс. розмір', output: 'Режим', convert: 'Розділити та конвертувати', clear: 'Очистити чергу', queue: 'Результати за сторінками', downloadall: 'Завантажити все (ZIP)', empty: 'Черга порожня', wait: 'У черзі', working: 'Обробка...', done: 'Готово', download: 'Завантажити PDF', error: 'Помилка', cancel: 'Видалити', pages: 'Сторінок', out: 'Розмір' },
  en: { subtitle: 'Page splitting · Grayscale · &lt; 490 KB', upload: 'Choose PDFs or drag and drop here', local: 'Processing locally in browser.', settings: 'Settings', resolution: 'Resolution', color: 'Color', size: 'Max size', output: 'Mode', convert: 'Split and Convert', clear: 'Clear queue', queue: 'Pages Queue', downloadall: 'Download all (ZIP)', empty: 'Queue is empty', wait: 'Queued', working: 'Processing...', done: 'Complete', download: 'Download PDF', error: 'Error', cancel: 'Remove', pages: 'Pages', out: 'Size' }
};
let lang = 'ru', queue = [], busy = false;
const s = k => i18n[lang][k] || k;
const escaped = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readable = n => n < 1024 * 1024 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
const baseName = n => n.replace(/\.pdf$/i, '');
function translate() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = s(el.dataset.i18n));
  ['ru','ua','en'].forEach(l => $(l).className = 'px-3 py-1 rounded ' + (lang === l ? 'bg-blue-700' : 'hover:bg-slate-800'));
  render();
}
['ru','ua','en'].forEach(l => $(l).addEventListener('click', () => { lang = l; translate(); }));

function add(files) {
  if (busy) return;
  for (const file of files) {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      queue.push({ file, status: 'wait', pages: 0, outputs: [], error: '' });
    }
  }
  render();
}
$('input').addEventListener('change', e => { add([...e.target.files]); e.target.value = ''; });
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag'); add([...e.dataTransfer.files]); });
$('clear').addEventListener('click', () => { if (busy) return; queue = []; render(); });

function render() {
  $('convert').disabled = busy \vert{}\vert{} !queue.some(q => q.status !== 'done');$('clear').disabled = busy;
  const hasOutputs = queue.some(q => q.outputs.length > 0);
  $('all').classList.toggle('hidden', !hasOutputs);

  $('queueItems').innerHTML = queue.length ? queue.map((q, i) => `
    <article class="border rounded-xl p-4 space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="font-semibold text-sm break-all">${escaped(q.file.name)}</p>
          <p class="text-xs text-slate-500 mt-1">${readable(q.file.size)} ${q.pages ? ' · ' + s('pages') + ': ' + q.pages : ''}</p>
          <p class="text-xs mt-1 ${q.status === 'error' ? 'text-red-700' : q.status === 'done' ? 'text-emerald-700' : 'text-blue-700'}">
            ${q.status === 'error' ? s('error') + ': ' + escaped(q.error) : q.status === 'working' ? s('working') + ' ' + (q.progress || '') : s(q.status)}
          </p>
        </div>
        <div>
          <button ${busy ? 'disabled' : ''} class="border text-xs px-3 py-2 rounded" data-action="remove" data-i="${i}">${s('cancel')}</button>
        </div>
      </div>
      ${q.outputs.length ? `
        <div class="border-t pt-3 grid sm:grid-cols-2 md:grid-cols-3 gap-2">
          ${q.outputs.map((out, oi) => `
            <div class="bg-slate-50 border rounded-lg p-2.5 flex items-center justify-between gap-2 text-xs">
              <span class="font-medium truncate" title="${escaped(out.name)}">Стр. ${out.pageNum}: ${readable(out.bytes.byteLength)}</span>
              <button class="bg-emerald-700 text-white px-2.5 py-1 rounded shrink-0" data-action="download-single" data-i="${i}" data-oi="${oi}">${s('download')}</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </article>
  `).join('') : `<p class="text-slate-400">${s('empty')}</p>`;
}

$('queueItems').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  if (btn.dataset.action === 'remove' && !busy) { queue.splice(i, 1); render(); }
  if (btn.dataset.action === 'download-single') {
    const out = queue[i].outputs[Number(btn.dataset.oi)];
    saveBlob(new Blob([out.bytes], { type: 'application/pdf' }), out.name);
  }
});

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('all').addEventListener('click', async () => {
  if (busy) return;
  const zip = new JSZip();
  for (const q of queue) {
    for (const out of q.outputs) {
      zip.file(out.name, out.bytes);
    }
  }
  saveBlob(await zip.generateAsync({ type: 'blob', compression: 'STORE' }), 'BankPDF_Split_Pages.zip');
});

function makeCanvas(w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  return canvas;
}

function grayPixels(canvas) {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const width = canvas.width;
  for (let y = 0; y < canvas.height; y += 128) {
    const h = Math.min(128, canvas.height - y);
    const im = ctx.getImageData(0, y, width, h);
    const d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const g = Math.round(.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]);
      d[i] = g; d[i + 1] = g; d[i + 2] = g;
    }
    ctx.putImageData(im, 0, y);
  }
}

function pause() { return new Promise(r => requestAnimationFrame(() => setTimeout(r, 0))); }

async function convertOne(q) {
  let source;
  try {
    source = await pdfjsLib.getDocument({
      data: new Uint8Array(await q.file.arrayBuffer()),
      useSystemFonts: true,
      cMapUrl: PDFJS_ASSETS + 'cmaps/',
      cMapPacked: true,
      standardFontDataUrl: PDFJS_ASSETS + 'standard_fonts/'
    }).promise;
    
    q.pages = source.numPages;
    q.outputs = [];

    for (let p = 1; p <= q.pages; p++) {
      q.progress = `(страница ${p} из ${q.pages})`;
      render();
      await pause();

      const page = await source.getPage(p);
      const size = page.getViewport({ scale: 1 });
      
      const dpisToTry = [300, 200, 150, 100];
      const qualities = [0.9, 0.8, 0.7, 0.6];
      let pdfBytes = null;

      for (let dIdx = 0; dIdx < dpisToTry.length; dIdx++) {
        let currentDpi = dpisToTry[dIdx];
        const viewport = page.getViewport({ scale: currentDpi / 72 });
        const w = Math.ceil(viewport.width), h = Math.ceil(viewport.height);
        const canvas = makeCanvas(w, h);
        const ctx = canvas.getContext
